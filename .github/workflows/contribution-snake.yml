name: Generate Contribution Graphs

on:
  schedule:
    # every hour
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PROFILE_USER: kazamijimin
      OUTPUT_BRANCH: output

    steps:
      - name: Generate and publish contribution graphs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import math
          import base64
          import urllib.request
          import urllib.error
          from datetime import date, datetime

          username = os.environ["PROFILE_USER"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          output_branch = os.environ.get("OUTPUT_BRANCH", "output")
          default_branch = os.environ.get("DEFAULT_BRANCH") or "main"

          def request_json(url, method="GET", payload=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "github-contribution-graphs"
              }

              body = None
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      content = response.read().decode("utf-8")
                      if not content:
                          return response.status, {}
                      return response.status, json.loads(content)
              except urllib.error.HTTPError as error:
                  content = error.read().decode("utf-8")
                  try:
                      parsed = json.loads(content)
                  except Exception:
                      parsed = {"message": content}
                  return error.code, parsed

          graphql_query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    firstDay
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          status, response = request_json(
              "https://api.github.com/graphql",
              method="POST",
              payload={
                  "query": graphql_query,
                  "variables": {"login": username}
              }
          )

          if status != 200:
              raise RuntimeError(f"GitHub GraphQL request failed: {status} {response}")

          if response.get("errors"):
              raise RuntimeError(f"GitHub GraphQL returned errors: {response['errors']}")

          user = response.get("data", {}).get("user")
          if not user:
              raise RuntimeError(f"GitHub user '{username}' was not found.")

          calendar = user["contributionsCollection"]["contributionCalendar"]
          weeks = calendar["weeks"]

          if not weeks:
              raise RuntimeError("GitHub returned no contribution weeks.")

          # -----------------------------
          # Build yearly weekly totals
          # -----------------------------
          weekly_dates = []
          weekly_values = []

          all_days = []

          for week in weeks:
              weekly_dates.append(week["firstDay"])
              weekly_total = 0

              for day in week["contributionDays"]:
                  weekly_total += day["contributionCount"]
                  all_days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

              weekly_values.append(weekly_total)

          total_contributions = calendar["totalContributions"]

          # -----------------------------
          # Build "This Month" daily totals
          # -----------------------------
          all_days_sorted = sorted(all_days, key=lambda item: item["date"])
          latest_day = all_days_sorted[-1]["date"]
          latest_dt = date.fromisoformat(latest_day)

          current_year = latest_dt.year
          current_month = latest_dt.month

          month_days = [
              item for item in all_days_sorted
              if date.fromisoformat(item["date"]).year == current_year
              and date.fromisoformat(item["date"]).month == current_month
          ]

          month_dates = [item["date"] for item in month_days]
          month_values = [item["count"] for item in month_days]

          # -----------------------------
          # Graph helpers
          # -----------------------------
          WIDTH = 960
          HEIGHT = 370

          LEFT = 72
          RIGHT = 32
          TOP = 105
          BOTTOM = 58

          graph_width = WIDTH - LEFT - RIGHT
          graph_height = HEIGHT - TOP - BOTTOM

          def generate_chart_svg(
              values,
              labels,
              title,
              subtitle,
              total_label,
              footer_text,
              theme="light",
              label_formatter=None
          ):
              if not values:
                  values = [0]
                  labels = [""]

              count = len(values)

              if theme == "dark":
                  background = "#0d1117"
                  border = "#30363d"
                  primary_text = "#f0f6fc"
                  secondary_text = "#8b949e"
                  grid = "#21262d"
                  line = "#36BCF7"
                  area = "#36BCF7"
              else:
                  background = "#ffffff"
                  border = "#d0d7de"
                  primary_text = "#1f2328"
                  secondary_text = "#656d76"
                  grid = "#d8dee4"
                  line = "#0969da"
                  area = "#54aeff"

              raw_max = max(max(values), 1)
              if raw_max <= 5:
                  y_max = 5
              elif raw_max <= 10:
                  y_max = 10
              else:
                  y_max = int(math.ceil(raw_max / 5.0) * 5)

              def x_position(index):
                  if count <= 1:
                      return LEFT
                  return LEFT + (index / (count - 1)) * graph_width

              def y_position(value):
                  return TOP + (1 - (value / y_max)) * graph_height

              points = [
                  (x_position(i), y_position(v))
                  for i, v in enumerate(values)
              ]

              line_points = " ".join(f"{x:.2f},{y:.2f}" for x, y in points)
              area_points = (
                  f"{points[0][0]:.2f},{TOP + graph_height:.2f} "
                  + line_points
                  + f" {points[-1][0]:.2f},{TOP + graph_height:.2f}"
              )

              label_count = min(7, count)
              if label_count <= 1:
                  label_indexes = [0]
              else:
                  label_indexes = sorted(set(
                      round(i * (count - 1) / (label_count - 1))
                      for i in range(label_count)
                  ))

              def format_label(raw):
                  if label_formatter:
                      return label_formatter(raw)
                  return raw

              svg = []

              svg.append(f'''<svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="{WIDTH}"
                    height="{HEIGHT}"
                    viewBox="0 0 {WIDTH} {HEIGHT}"
                    role="img"
                    aria-labelledby="title description"
                  >''')

              svg.append(f'''
                  <title id="title">{title}</title>
                  <desc id="description">{subtitle}</desc>
              ''')

              svg.append(f'''
                  <rect
                    x="0.5"
                    y="0.5"
                    width="{WIDTH - 1}"
                    height="{HEIGHT - 1}"
                    rx="14"
                    fill="{background}"
                    stroke="{border}"
                  />
              ''')

              svg.append(f'''
                  <text
                    x="{LEFT}"
                    y="36"
                    fill="{primary_text}"
                    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
                    font-size="21"
                    font-weight="700"
                  >
                    {title}
                  </text>
              ''')

              svg.append(f'''
                  <text
                    x="{LEFT}"
                    y="60"
                    fill="{secondary_text}"
                    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
                    font-size="13"
                  >
                    {subtitle}
                  </text>
              ''')

              svg.append(f'''
                  <text
                    x="{WIDTH - RIGHT}"
                    y="36"
                    text-anchor="end"
                    fill="{primary_text}"
                    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
                    font-size="18"
                    font-weight="700"
                  >
                    {sum(values):,}
                  </text>
              ''')

              svg.append(f'''
                  <text
                    x="{WIDTH - RIGHT}"
                    y="58"
                    text-anchor="end"
                    fill="{secondary_text}"
                    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
                    font-size="12"
                  >
                    {total_label}
                  </text>
              ''')

              grid_lines = 5
              for index in range(grid_lines + 1):
                  ratio = index / grid_lines
                  y = TOP + (ratio * graph_height)
                  value = round(y_max * (1 - ratio))

                  svg.append(f'''
                      <line
                        x1="{LEFT}"
                        y1="{y:.2f}"
                        x2="{WIDTH - RIGHT}"
                        y2="{y:.2f}"
                        stroke="{grid}"
                        stroke-width="1"
                      />
                  ''')

                  svg.append(f'''
                      <text
                        x="{LEFT - 14}"
                        y="{y + 4:.2f}"
                        text-anchor="end"
                        fill="{secondary_text}"
                        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
                        font-size="11"
                      >
                        {value}
                      </text>
                  ''')

              svg.append(f'''
                  <polygon
                    points="{area_points}"
                    fill="{area}"
                    opacity="0.10"
                  />
              ''')

              svg.append(f'''
                  <polyline
                    points="{line_points}"
                    fill="none"
                    stroke="{line}"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
              ''')

              for x, y in points:
                  svg.append(f'''
                      <circle
                        cx="{x:.2f}"
                        cy="{y:.2f}"
                        r="2.8"
                        fill="{line}"
                      />
                  ''')

              highest_index = values.index(max(values))
              highest_x, highest_y = points[highest_index]

              svg.append(f'''
                  <circle
                    cx="{highest_x:.2f}"
                    cy="{highest_y:.2f}"
                    r="6"
                    fill="{background}"
                    stroke="{line}"
                    stroke-width="3"
                  />
              ''')

              for idx in label_indexes:
                  x = x_position(idx)
                  label = format_label(labels[idx])

                  svg.append(f'''
                      <text
                        x="{x:.2f}"
                        y="{HEIGHT - 27}"
                        text-anchor="middle"
                        fill="{secondary_text}"
                        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
                        font-size="11"
                      >
                        {label}
                      </text>
                  ''')

              svg.append(f'''
                  <text
                    x="{LEFT}"
                    y="{HEIGHT - 7}"
                    fill="{secondary_text}"
                    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
                    font-size="10"
                  >
                    {footer_text}
                  </text>
              ''')

              svg.append("</svg>")
              return "\n".join(svg)

          # -----------------------------
          # Year chart
          # -----------------------------
          best_week = max(weekly_values) if weekly_values else 0
          active_weeks = sum(1 for value in weekly_values if value > 0)
          average_week = (sum(weekly_values) / len(weekly_values)) if weekly_values else 0

          yearly_footer = (
              f"Best week: {best_week} · "
              f"Average/week: {average_week:.1f} · "
              f"Active weeks: {active_weeks}/{len(weekly_values)}"
          )

          def format_year_label(raw):
              return date.fromisoformat(raw).strftime("%b %Y")

          yearly_light = generate_chart_svg(
              values=weekly_values,
              labels=weekly_dates,
              title="GitHub Contribution Activity",
              subtitle="Weekly contributions · Last 12 months",
              total_label="total contributions",
              footer_text=yearly_footer,
              theme="light",
              label_formatter=format_year_label
          )

          yearly_dark = generate_chart_svg(
              values=weekly_values,
              labels=weekly_dates,
              title="GitHub Contribution Activity",
              subtitle="Weekly contributions · Last 12 months",
              total_label="total contributions",
              footer_text=yearly_footer,
              theme="dark",
              label_formatter=format_year_label
          )

          # -----------------------------
          # Month chart
          # -----------------------------
          best_day = max(month_values) if month_values else 0
          active_days = sum(1 for value in month_values if value > 0)
          average_day = (sum(month_values) / len(month_values)) if month_values else 0
          month_title = latest_dt.strftime("%B %Y")

          month_footer = (
              f"Best day: {best_day} · "
              f"Average/day: {average_day:.1f} · "
              f"Active days: {active_days}/{len(month_values)}"
          )

          def format_month_label(raw):
              d = date.fromisoformat(raw)
              return d.strftime("%b %d").replace(" 0", " ")

          monthly_light = generate_chart_svg(
              values=month_values,
              labels=month_dates,
              title="GitHub Contribution Activity",
              subtitle=f"Daily contributions · {month_title}",
              total_label="this month",
              footer_text=month_footer,
              theme="light",
              label_formatter=format_month_label
          )

          monthly_dark = generate_chart_svg(
              values=month_values,
              labels=month_dates,
              title="GitHub Contribution Activity",
              subtitle=f"Daily contributions · {month_title}",
              total_label="this month",
              footer_text=month_footer,
              theme="dark",
              label_formatter=format_month_label
          )

          api_root = f"https://api.github.com/repos/{repository}"

          status, output_ref = request_json(f"{api_root}/git/ref/heads/{output_branch}")

          if status == 404:
              status, default_ref = request_json(f"{api_root}/git/ref/heads/{default_branch}")
              if status != 200:
                  raise RuntimeError("Could not read default branch.")

              source_sha = default_ref["object"]["sha"]

              status, created = request_json(
                  f"{api_root}/git/refs",
                  method="POST",
                  payload={
                      "ref": f"refs/heads/{output_branch}",
                      "sha": source_sha
                  }
              )

              if status not in (200, 201):
                  raise RuntimeError(f"Could not create output branch: {created}")

          elif status != 200:
              raise RuntimeError(f"Unable to inspect output branch: {output_ref}")

          def publish_file(filename, content):
              file_url = f"{api_root}/contents/{filename}"
              status, existing = request_json(f"{file_url}?ref={output_branch}")

              encoded = base64.b64encode(content.encode("utf-8")).decode("ascii")

              payload = {
                  "message": f"Update {filename}",
                  "content": encoded,
                  "branch": output_branch
              }

              if status == 200:
                  payload["sha"] = existing["sha"]
              elif status != 404:
                  raise RuntimeError(f"Unable to inspect {filename}: {existing}")

              status, result = request_json(
                  file_url,
                  method="PUT",
                  payload=payload
              )

              if status not in (200, 201):
                  raise RuntimeError(f"Unable to publish {filename}: {result}")

              print(f"Published {filename}")

          publish_file("github-contribution-line.svg", yearly_light)
          publish_file("github-contribution-line-dark.svg", yearly_dark)
          publish_file("github-contribution-this-month.svg", monthly_light)
          publish_file("github-contribution-this-month-dark.svg", monthly_dark)

          print("Contribution graphs generated successfully.")
          PY
